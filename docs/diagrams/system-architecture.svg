<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1190" viewBox="0 0 1400 1190" role="img" aria-labelledby="title desc"><title id="title">QIMA Discovery &amp; Outreach — system architecture and request flow</title><desc id="desc">Current local application: React browser requests FastAPI; API and background worker share PostgreSQL; selected agents use model and discovery adapters; human-approved outreach is simulated. Numbered arrows correspond to the request flow legend.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#415778" /></marker><marker id="async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#236b65" /></marker></defs><rect width="1400" height="1190" fill="#f5f7fb" /><text x="70" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#17283e" font-weight="700" text-anchor="start">QIMA · Discovery &amp; Outreach</text><text x="70" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#586c83" font-weight="600" text-anchor="start">SYSTEM ARCHITECTURE + REQUEST FLOW  /  CURRENT LOCAL CONFIGURATION  /  19 OCTOBER 2026</text><path d="M 700 240 V 350" fill="none" stroke="#415778" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)" /><rect x="562.45" y="261" width="275.1" height="51" rx="6" fill="#f5f7fb" /><text x="700" y="279" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#415778" font-weight="600" text-anchor="middle">1 · Commands / queries</text><text x="700" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#415778" font-weight="600" text-anchor="middle">JSON results + progress polling</text><path d="M 880 415 H 1020" fill="none" stroke="#415778" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)" /><rect x="909.65" y="375" width="80.69999999999999" height="28" rx="6" fill="#f5f7fb" /><text x="950" y="393" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#415778" font-weight="600" text-anchor="middle">2 · SQL</text><path d="M 1020 460 H 950 V 715 H 880" fill="none" stroke="#236b65" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#async)" marker-start="url(#async)" stroke-dasharray="8 6" /><rect x="999.85" y="576" width="210.29999999999998" height="51" rx="6" fill="#f5f7fb" /><text x="1105" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#236b65" font-weight="600" text-anchor="middle">3 · Poll jobs; persist</text><text x="1105" y="617" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#236b65" font-weight="600" text-anchor="middle">checkpoints and results</text><path d="M 700 780 V 900" fill="none" stroke="#236b65" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#async)" stroke-dasharray="8 6" /><rect x="566.5" y="821" width="267.0" height="28" rx="6" fill="#f5f7fb" /><text x="700" y="839" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#236b65" font-weight="600" text-anchor="middle">4 · Execute selected objective</text><path d="M 520 965 H 440 V 740 H 380" fill="none" stroke="#415778" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)" /><rect x="194.15" y="832" width="161.7" height="51" rx="6" fill="#f5f7fb" /><text x="275" y="850" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#415778" font-weight="600" text-anchor="middle">5 · Plan, extract</text><text x="275" y="873" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#415778" font-weight="600" text-anchor="middle">and classify</text><path d="M 880 965 H 1020" fill="none" stroke="#415778" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)" /><rect x="881.3" y="924" width="137.39999999999998" height="28" rx="6" fill="#f5f7fb" /><text x="950" y="942" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#415778" font-weight="600" text-anchor="middle">6 · Tool calls</text><path d="M 520 445 H 460 V 690 H 380" fill="none" stroke="#415778" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)" /><rect x="145.55" y="542" width="258.9" height="51" rx="6" fill="#f5f7fb" /><text x="275" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#415778" font-weight="600" text-anchor="middle">API calls model directly</text><text x="275" y="583" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#415778" font-weight="600" text-anchor="middle">for drafts / replies / offers</text><path d="M 520 415 H 380" fill="none" stroke="#415778" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="389.4" y="358" width="121.19999999999999" height="51" rx="6" fill="#f5f7fb" /><text x="450" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#415778" font-weight="600" text-anchor="middle">7 · Approved</text><text x="450" y="399" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#415778" font-weight="600" text-anchor="middle">version</text><path d="M 880 380 H 950 V 190 H 1020" fill="none" stroke="#415778" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)" /><rect x="1022.95" y="276" width="194.1" height="28" rx="6" fill="#f5f7fb" /><text x="1120" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#415778" font-weight="600" text-anchor="middle">8 · Upload / download</text><rect x="520" y="140" width="360" height="100" rx="14" fill="#ffffff" stroke="#c8d3e3" stroke-width="1.5" /><rect x="520" y="158" width="5" height="64" rx="2" fill="#375e98" /><text x="542" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#17283e" font-weight="700" text-anchor="start">User + React browser</text><text x="542" y="199" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Vite · localhost:5173</text><text x="542" y="223" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Human selects objective and reviews</text><rect x="520" y="350" width="360" height="130" rx="14" fill="#ffffff" stroke="#c8d3e3" stroke-width="1.5" /><rect x="520" y="368" width="5" height="94" rx="2" fill="#375e98" /><text x="542" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#17283e" font-weight="700" text-anchor="start">FastAPI + business services</text><text x="542" y="409" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">localhost:8000 · local identity + roles</text><text x="542" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Validation, approvals and transactions</text><text x="542" y="457" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">HTTP JSON API; idempotent commands</text><rect x="1020" y="350" width="300" height="130" rx="14" fill="#ffffff" stroke="#c8d3e3" stroke-width="1.5" /><rect x="1020" y="368" width="5" height="94" rx="2" fill="#375e98" /><text x="1042" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#17283e" font-weight="700" text-anchor="start">PostgreSQL 16</text><text x="1042" y="409" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">localhost:5432 · source of truth</text><text x="1042" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Jobs, outbox and checkpoints</text><text x="1042" y="457" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Evidence, scores, drafts and audit</text><rect x="1020" y="140" width="300" height="100" rx="14" fill="#ffffff" stroke="#c8d3e3" stroke-width="1.5" /><rect x="1020" y="158" width="5" height="64" rx="2" fill="#375e98" /><text x="1042" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#17283e" font-weight="700" text-anchor="start">Document storage</text><text x="1042" y="199" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Local files; metadata in PostgreSQL</text><text x="1042" y="223" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">TXT / CSV offer extraction via API</text><rect x="80" y="350" width="300" height="130" rx="14" fill="#fff9ed" stroke="#c8d3e3" stroke-width="1.5" /><rect x="80" y="368" width="5" height="94" rx="2" fill="#a66a18" /><text x="102" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#17283e" font-weight="700" text-anchor="start">Outreach provider</text><text x="102" y="409" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Mock email · stable simulated result</text><text x="102" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Instagram · manual action record</text><text x="102" y="457" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Current draft version needs approval</text><rect x="520" y="650" width="360" height="130" rx="14" fill="#f0faf7" stroke="#c8d3e3" stroke-width="1.5" /><rect x="520" y="668" width="5" height="94" rx="2" fill="#236b65" /><text x="542" y="682" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#17283e" font-weight="700" text-anchor="start">Background worker</text><text x="542" y="709" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Separate Python process</text><text x="542" y="733" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Durable checkpoints + retry handling</text><text x="542" y="757" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Deterministic scoring + follow-ups</text><rect x="80" y="650" width="300" height="130" rx="14" fill="#ffffff" stroke="#c8d3e3" stroke-width="1.5" /><rect x="80" y="668" width="5" height="94" rx="2" fill="#375e98" /><text x="102" y="682" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#17283e" font-weight="700" text-anchor="start">Model service</text><text x="102" y="709" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Mock structured model outputs</text><text x="102" y="733" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Research plans, evidence and drafts</text><text x="102" y="757" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">API and research runtime both call it</text><rect x="520" y="900" width="360" height="130" rx="14" fill="#f0faf7" stroke="#c8d3e3" stroke-width="1.5" /><rect x="520" y="918" width="5" height="94" rx="2" fill="#236b65" /><text x="542" y="932" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#17283e" font-weight="700" text-anchor="start">Agent workflow + tool runtime</text><text x="542" y="959" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">LeadAgent OR SourcingAgent</text><text x="542" y="983" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Find buyers OR find suppliers</text><text x="542" y="1007" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Bounded tools + provenance checks</text><rect x="1020" y="900" width="300" height="130" rx="14" fill="#ffffff" stroke="#c8d3e3" stroke-width="1.5" /><rect x="1020" y="918" width="5" height="94" rx="2" fill="#375e98" /><text x="1042" y="932" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#17283e" font-weight="700" text-anchor="start">Discovery tools</text><text x="1042" y="959" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Mock search + demo evidence</text><text x="1042" y="983" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Safe website-fetch adapter</text><text x="1042" y="1007" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Unavailable sources stay explicit</text><rect x="70" y="1070" width="1260" height="90" rx="12" fill="#e9eef6" /><text x="92" y="1098" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334c70" font-weight="700" text-anchor="start">REQUEST FLOW</text><text x="92" y="1123" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#17283e" font-weight="400" text-anchor="start">POST search → job ID → worker checkpoints → stored candidates + scores → browser polls → human review.</text><text x="92" y="1147" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4c617a" font-weight="400" text-anchor="start">Solid arrows: requests / reads / writes. Dashed arrows: background processing. Local mode uses database polling.</text></svg>