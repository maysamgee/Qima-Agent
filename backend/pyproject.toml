[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qima-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0.36,<3", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "boto3>=1.36,<2", "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3", "python-multipart>=0.0.20,<1", "prometheus-client>=0.21,<1"
]
[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-boto3>=1.36", "pip-audit>=2.8,<3"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["scoring/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests", "../worker/tests"]
pythonpath = [".", ".."]
addopts = "-q"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["app", "../worker/app"]
